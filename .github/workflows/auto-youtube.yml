name: 2 Videos Daily Auto-Uploader

on:
  schedule:
    # GitHub Actions UTC में चलता है
    # 00:30 UTC = सुबह 6:00 बजे IST
    # 13:30 UTC = शाम 7:00 बजे IST
    - cron: '30 0,13 * * *'

  # जरूरत पड़ने पर manually भी चला सकते हैं
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/rights="none"/rights="read|write"/' /etc/ImageMagick-6/policy.xml

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==1.0.3 \
            edge-tts \
            gtts \
            numpy \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            Pillow==9.5.0 \
            imageio-ffmpeg \
            google-generativeai

      - name: Load YouTube Token
        env:
          TOKEN_1: ${{ secrets.TOKEN_1 }}
        run: |
          mkdir -p tokens

          if [ -n "$TOKEN_1" ]; then
            echo "$TOKEN_1" | base64 --decode > tokens/token1.json
            echo "✅ YouTube token लोड हो गया है!"
          else
            echo "❌ TOKEN_1 secret नहीं मिला!"
            exit 1
          fi

      - name: Run Auto-Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY secret नहीं मिली!"
            exit 1
          fi

          echo "🚀 Bot शुरू हो रहा है..."
          python -u bot.py

      - name: Commit Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add questions.json 2>/dev/null || true
          git commit -m "🤖 Auto update" || echo "कोई बदलाव नहीं है"
          git push || echo "Push करने के लिए कोई बदलाव नहीं है"
